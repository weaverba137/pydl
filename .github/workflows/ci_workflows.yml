name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  schedule:
    # run every Wednesday at 5pm UTC
    - cron: '17 0 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job names describe roles ("oldest"/"intermediate"/"current"/"latest" Python)
  # rather than versions, so they stay stable if they are made required status
  # checks. When bumping Python versions, change the python/toxenv values below
  # (and in ci_cron_weekly.yml), not the names. "latest" (devdeps) moves to a
  # new Python first. When 3.11 is dropped, "oldest" becomes 3.12 and both
  # "intermediate" jobs become 3.13.
  tests:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - name: Code style checks
            os: ubuntu-latest
            python: 3.x
            toxenv: codestyle

          - name: Documentation build check
            os: ubuntu-latest
            python: 3.x
            toxenv: build_docs

          - name: Linux - oldest Python, base dependencies
            os: ubuntu-latest
            python: '3.11'
            toxenv: py311-test

          - name: Linux - oldest Python, oldest dependencies
            os: ubuntu-24.04
            python: '3.11'
            toxenv: py311-test-oldestdeps

          - name: Linux - intermediate Python, base dependencies
            os: ubuntu-latest
            python: '3.13'
            toxenv: py313-test

          - name: Windows - intermediate Python, base dependencies
            os: windows-latest
            python: '3.12'
            toxenv: py312-test

          - name: macOS - current Python, base dependencies
            os: macos-latest
            python: '3.14'
            toxenv: py314-test

          - name: Linux - current Python, remote data, coverage
            os: ubuntu-latest
            python: '3.14'
            toxenv: py314-test-cov
            toxargs: -v
            toxposargs: --remote-data=any

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - name: Install language-pack-de and tzdata
      if: startsWith(matrix.os, 'ubuntu')
      run: |
          sudo apt-get update
          sudo apt-get install graphviz
    - name: Install Python dependencies
      run: python -m pip install --upgrade tox
    - name: Run tests
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: tox ${{ matrix.toxargs }} -e ${{ matrix.toxenv }} -- ${{ matrix.toxposargs }}

  allowed_failures:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: (Allowed Failure) Linux - latest Python, dev dependencies, remote data
            os: ubuntu-latest
            python: '3.15'
            toxenv: py315-test-devdeps
            toxargs: -v
            toxposargs: --remote-data=any

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true
    # - name: Install language-pack-de and tzdata
    #   if: startsWith(matrix.os, 'ubuntu')
    #   run: |
    #       sudo apt-get update
    #       sudo apt-get install language-pack-de tzdata
    - name: Install Python dependencies
      run: python -m pip install --upgrade tox
    - name: Run tests
      # This is the specific switch for allowed failures.
      continue-on-error: true
      run: tox ${{ matrix.toxargs }} -e ${{ matrix.toxenv }} -- ${{ matrix.toxposargs }}
