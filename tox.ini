[tox]
envlist =
    py{310,311,312,313}-test{,-devdeps,-oldestdeps,-predeps}{,-cov,-external}
    build_docs
    linkcheck
    codestyle
isolated_build = true

[testenv]
# Suppress display of matplotlib plots generated during docs build
setenv =
    MPLBACKEND=agg
    devdeps: PIP_EXTRA_INDEX_URL = https://pypi.anaconda.org/astropy/simple https://pypi.anaconda.org/liberfa/simple https://pypi.anaconda.org/scientific-python-nightly-wheels/simple

# Pass through the following environment variables which may be needed for the CI
passenv = HOME,WINDIR,LC_ALL,LC_CTYPE,CC,CI,GITHUB_*,COVERALLS_*

# Run the tests in a temporary directory to make sure that we don't import
# this package from the source tree
changedir = .tmp/{envname}

# tox environments are constructed with so-called 'factors' (or terms)
# separated by hyphens, e.g. test-devdeps-cov. Lines below starting with factor:
# will only take effect if that factor is included in the environment name. To
# see a list of example environments that can be run, along with a description,
# run:
#
#     tox -l -v
#
description =
    run tests
    devdeps: with the latest developer version of key dependencies
    oldestdeps: with the oldest supported version of key dependencies
    predeps: with any pre-release if available
    cov: and test coverage

# The following provides some specific pinnings for key packages
deps =

    cov: coveralls

    oldestdeps: numpy<1.23
    oldestdeps: scipy<1.9
    oldestdeps: astropy<6.1
    # These are pinned to avoid upgrading numpy.
    oldestdeps: matplotlib<3.9

    devdeps: numpy>=0.0.dev0
    devdeps: scipy>=0.0.dev0
    devdeps: matplotlib>=0.0.dev0
    devdeps: astropy>=0.0.dev0

# The following indicates which extras_require from setup.cfg will be installed
extras =
    test

commands =
    # Force numpy-dev after matplotlib downgrades it (https://github.com/matplotlib/matplotlib/issues/26847)
    devdeps: python -m pip install --pre --upgrade --extra-index-url https://pypi.anaconda.org/scientific-python-nightly-wheels/simple numpy
    pip freeze
    !cov: pytest --pyargs pydl '{toxinidir}/docs' {posargs}
    cov: pytest --pyargs pydl '{toxinidir}/docs' --cov pydl --cov-config='{toxinidir}/setup.cfg' {posargs}
    cov: coveralls

pip_pre =
    predeps: true
    !predeps: false

[testenv:build_docs]
changedir = docs
description = invoke sphinx-build to build the HTML docs
extras = docs
commands =
    python --version
    pip freeze
    sphinx-build -W --keep-going -b html . _build/html

[testenv:linkcheck]
changedir = docs
description = check the links in the HTML docs
extras = docs
commands =
    python --version
    pip freeze
    sphinx-build -W --keep-going -b linkcheck . _build/html

[testenv:codestyle]
skip_install = true
changedir = .
description = check code style, e.g. with flake8
deps = flake8
commands =
    -flake8 pydl -qq --statistics
    flake8 pydl --count
